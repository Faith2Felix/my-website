<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS PRACTICE</title>
    <script src="dom.js" defer></script>
    <style>
      body {
        background-color: powderblue;
        font-family: sans-serif;
        font-size: 20px;
        margin: 20px;
        padding: 40px;
      }

      .text {
        color: red;
        padding: 20px;
      }
      #logo {
        width: 90%;
        border-radius: 15px;
        margin-bottom: 30px;
      }
      #link {
        background: beige;
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
      }

      a {
        text-decoration: none;
      }
      .hymn {
        padding: 10px;
        cursor: pointer;
        border: 1px solid #ad1818;
        margin: 10px;
      }

      ul {
        list-style-type: square;
      }

      .active {
        background-color: gold;
      }

      .primary {
        color: blue;
      }

      .large {
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <!--SELECTING DOM ELEMENT (.getElementById, .querySelector(), .querySelectorAll())-->
    <p class="text">Paragraph 1</p>
    <p class="text">Paragraph 2</p>
    <p class="text">Paragraph 3</p>

    <!--MODIFYING ATTRIBUTES-->

    <img id="logo" src="./Images/house-1.jpg" alt="Company Logo" />
    <br /><a id="link" href="./Images/house-3.jpg">Visit Site</a>

    <!-- ADDING AND REMOVING CLASSES-->
    <ul id="hymns">
      <li id="hymn1" class="hymn">Amazing Grace</li>
      <li id="hymn2" class="hymn">How Great Thou Art</li>
      <li id="hymn3" class="hymn">Great Is The Faithfullness</li>
    </ul>

    <div id="example">Welcome to <strong>our website</strong></div>
 
    <p id="demo"></p>
  </body>
</html>
